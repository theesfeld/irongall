[workspace]
resolver = "2"
members = ["crates/irongall", "crates/irongall-core", "crates/irongall-tui"]
default-members = ["crates/irongall"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/theesfeld/irongall"
homepage = "https://github.com/theesfeld/irongall"
description = "One 16-color theme, one typeface, one font size — applied across Linux"
authors = ["irongall contributors"]
rust-version = "1.74"
keywords = ["theme", "font", "base16", "tui"]
categories = ["command-line-utilities"]

[workspace.dependencies]
irongall-core = { path = "crates/irongall-core", version = "0.1.3" }
irongall-tui = { path = "crates/irongall-tui", version = "0.1.3" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.28"
dirs = "6"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
