name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          stage="dist/irongall-${ver}-${target}"
          mkdir -p "${stage}/completions"
          cp "target/${target}/release/irongall" "${stage}/irongall"
          cp LICENSE README.md "${stage}/"
          "./target/${target}/release/irongall" completions bash > "${stage}/completions/irongall.bash"
          "./target/${target}/release/irongall" completions fish > "${stage}/completions/irongall.fish"
          tar -C dist -czf "dist/irongall-${ver}-${target}.tar.gz" "irongall-${ver}-${target}"
      - uses: actions/upload-artifact@v4
        with:
          name: irongall-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum irongall-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
